<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Study Companion</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <h1>Accessible Study Companion</h1>
    </header>

    <main class="workspace">

        <section class="video-section" aria-labelledby="video-heading">
            <h2 id="video-heading">Video Player</h2>

            <video
                id="videoPlayer"
                controls
                aria-label="Programming tutorial video"
            >
                Your browser does not support video playback.
            </video>

            <button id="extractButton" type="button">
                Extract Code from Current Video Position
            </button>
        </section>

        <section class="code-section" aria-labelledby="code-heading">
            <h2 id="code-heading">Recognised Code</h2>

            <pre
                id="ocrOutput"
                tabindex="0"
                aria-label="Extracted programming code"
            >Extracted code will appear here.</pre>

            <button id="copyButton" type="button">
                Copy Code
            </button>
        </section>

        <!-- Screen readers are informed when an operation finishes -->
        <div
            id="statusMessage"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <!-- Errors are announced with higher priority -->
        <div
            id="errorMessage"
            role="alert"
            aria-atomic="true"
        ></div>
        <section class="settings-section" aria-labelledby="settings-heading">

            <h2 id="settings-heading">Personalisation Settings</h2>

            <div class="setting">
                <label for="textSize">Recognised Code Text Size</label>

                <select id="textSize">
                    <option value="14">Small</option>
                    <option value="16" selected>Medium</option>
                    <option value="20">Large</option>
                    <option value="24">Extra Large</option>
                </select>
            </div>

            <div class="setting">
                <input type="checkbox" id="highContrast">

                <label for="highContrast">
                    Enable High-Contrast Mode
                </label>
            </div>

            <button type="button" id="resetSettings">
                Reset Personalisation Settings
            </button>

            <p id="settingsStatus" role="status" aria-live="polite"></p>

        </section>

    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
